<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AwakeTab</title>
  </head>
  <body>
    <div class="wl" data-root hidden>
      <header class="wl-head">
        <div class="at-logo">
          <span data-mark-slot data-size="26"></span>
          <span data-i18n="app.name"></span><span class="at-logo-sub"><svg data-logo="chrome" width="16" height="16"></svg><span data-i18n="ext.options.forChrome"></span></span>
        </div>
        <div class="wl-head-end">
          <nav class="wl-nav" data-i18n-aria="ext.welcome.navLabel">
            <a class="at-link at-link-ink" href="options.html" data-i18n="settings.title"></a>
            <a class="at-link" href="https://awaketab.com/?source=ext" target="_blank" rel="noopener"><span data-i18n="ext.popup.open"></span><svg data-icon="external-link" width="16" height="16"></svg></a>
          </nav>
          <div class="at-seg wl-theme" role="radiogroup" data-i18n-aria="settings.theme" style="--n: 3">
            <span class="at-seg-ind" aria-hidden="true"></span>
            <label class="at-seg-item" data-i18n-title="settings.theme.light"><input class="at-sr" type="radio" name="theme" value="light" data-i18n-aria="settings.theme.light" /><svg data-icon="sun" width="20" height="20"></svg></label>
            <label class="at-seg-item" data-i18n-title="settings.theme.dark"><input class="at-sr" type="radio" name="theme" value="dark" data-i18n-aria="settings.theme.dark" /><svg data-icon="moon" width="20" height="20"></svg></label>
            <label class="at-seg-item" data-i18n-title="ext.theme.autoAria"><input class="at-sr" type="radio" name="theme" value="auto" data-i18n-aria="ext.theme.autoAria" /><svg data-icon="contrast" width="20" height="20"></svg></label>
          </div>
        </div>
      </header>

      <main class="wl-main">
        <section class="wl-hero" aria-labelledby="w-h1" data-hero data-step="1">
          <div class="wl-hero-text at-in">
            <p class="wl-kicker" data-kicker></p>
            <h1 id="w-h1" tabindex="-1" data-hero-title></h1>
            <p class="wl-intro" aria-live="polite" data-hero-lead></p>
            <div class="wl-hero-actions">
              <button class="at-btn at-btn-primary" type="button" data-finish data-i18n="ext.welcome.pinnedIt"></button>
              <button class="at-btn at-btn-stop" type="button" data-finish data-i18n="ext.welcome.skip"></button>
            </div>
            <p class="wl-note" data-i18n="ext.welcome.noSite"></p>
          </div>
          <figure class="wl-hero-art at-rise" role="img" data-i18n-aria="ext.welcome.scene">
            <svg class="wl-scene" width="440" height="330" viewBox="0 0 320 240" aria-hidden="true" focusable="false"><path d="M56 120a104 104 0 1 0 208 0a104 104 0 1 0 -208 0Z" fill="var(--at-scene-blob)"/><path d="M38 60a22 22 0 1 0 44 0a22 22 0 1 0 -44 0Z" fill="var(--at-scene-blob-2)"/><path d="M52 50h216a16 16 0 0 1 16 16v118a16 16 0 0 1 -16 16h-216a16 16 0 0 1 -16 -16v-118a16 16 0 0 1 16 -16Z  M52 50h216a16 16 0 0 1 16 16v2a16 16 0 0 1 -16 16h-216a16 16 0 0 1 -16 -16v-2a16 16 0 0 1 16 -16Z  M221 58h18a9 9 0 0 1 9 9v0a9 9 0 0 1 -9 9h-18a9 9 0 0 1 -9 -9v0a9 9 0 0 1 9 -9Z  M58 30h8a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2v-8a2 2 0 0 1 2 -2Z M278 30h6a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-6a2 2 0 0 1 -2 -2v-6a2 2 0 0 1 2 -2Z M30 196h6a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-6a2 2 0 0 1 -2 -2v-6a2 2 0 0 1 2 -2Z  M256 210h8a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2v-8a2 2 0 0 1 2 -2Z M102 22h6a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-6a2 2 0 0 1 -2 -2v-6a2 2 0 0 1 2 -2Z  M62 100h76a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-76a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="var(--at-scene-shadow)" transform="translate(6 6)"/><path d="M52 50h216a16 16 0 0 1 16 16v118a16 16 0 0 1 -16 16h-216a16 16 0 0 1 -16 -16v-118a16 16 0 0 1 16 -16Z" fill="var(--at-scene-w)" stroke="var(--at-scene-ink)" stroke-width="3" stroke-linejoin="round"/><path d="M52 50h216a16 16 0 0 1 16 16v2a16 16 0 0 1 -16 16h-216a16 16 0 0 1 -16 -16v-2a16 16 0 0 1 16 -16Z" fill="var(--at-scene-p)" stroke="var(--at-scene-ink)" stroke-width="3" stroke-linejoin="round"/><path d="M221 58h18a9 9 0 0 1 9 9v0a9 9 0 0 1 -9 9h-18a9 9 0 0 1 -9 -9v0a9 9 0 0 1 9 -9Z" fill="var(--at-scene-m)" stroke="var(--at-scene-ink)" stroke-width="3" stroke-linejoin="round"/><path d="M58 30h8a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2v-8a2 2 0 0 1 2 -2Z M278 30h6a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-6a2 2 0 0 1 -2 -2v-6a2 2 0 0 1 2 -2Z M30 196h6a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-6a2 2 0 0 1 -2 -2v-6a2 2 0 0 1 2 -2Z" fill="var(--at-scene-act)" stroke="var(--at-scene-ink)" stroke-width="3" stroke-linejoin="round"/><path d="M256 210h8a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2v-8a2 2 0 0 1 2 -2Z M102 22h6a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-6a2 2 0 0 1 -2 -2v-6a2 2 0 0 1 2 -2Z" fill="var(--at-scene-v)" stroke="var(--at-scene-ink)" stroke-width="3" stroke-linejoin="round"/><path d="M62 100h76a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-76a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="var(--at-scene-lamp)" stroke="var(--at-scene-ink)" stroke-width="3" stroke-linejoin="round"/><path d="M164 108 H262 M164 126 H244 M164 144 H254 M164 162 H226 M52 67 h0 M66 67 h0" fill="none" stroke="var(--at-scene-ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M294 120h12M300 114v12 M15 120h10M20 115v10" fill="none" stroke="var(--at-scene-spark)" stroke-width="3.5" stroke-linecap="round"/><circle cx="230" cy="67" r="13.8" fill="var(--at-scene-lamp)" opacity="0.35"/><circle cx="230" cy="67" r="6" fill="var(--at-scene-lamp)" stroke="var(--at-scene-ink)" stroke-width="3"/><circle cx="228.2" cy="65.2" r="1.68" fill="#fff" opacity="0.85"/></svg>
          </figure>
        </section>

        <section class="wl-section wl-pinsec" aria-labelledby="w-pin" id="pin">
          <div class="wl-pin-text">
            <p class="wl-kicker"><span class="wl-kicker-dot" aria-hidden="true"></span><span data-installed></span></p>
            <h2 id="w-pin" data-i18n="ext.welcome.pin.title"></h2>
            <p class="wl-lead" data-i18n="ext.welcome.lead"></p>
            <ol class="wl-steps" data-pin-steps>
              <li><span class="wl-step" aria-hidden="true">1</span><span data-i18n="ext.welcome.step1"></span></li>
              <li><span class="wl-step" aria-hidden="true">2</span><span data-step2></span></li>
            </ol>
          </div>

          <figure class="wl-mock at-rise" data-i18n-aria="ext.welcome.figure" data-pin-figure>
            <div class="wl-window" data-placeholder="Chrome window">
              <div class="wl-bar">
                <span class="wl-dots" aria-hidden="true"><span></span><span></span><span></span></span>
                <div class="wl-url" aria-hidden="true">awaketab.com</div>
                <span class="wl-pinned at-in" data-pinned hidden>
                  <span data-mark-slot data-size="22" data-glow="0"></span>
                  <span class="wl-badge" aria-hidden="true">25m</span>
                </span>
                <span class="wl-slot" aria-hidden="true" data-slot></span>
                <span class="wl-puzzle" data-puzzle aria-hidden="true">
                  <svg data-icon="puzzle" width="20" height="20"></svg>
                  <span class="wl-mark" data-mark>1</span>
                </span>
                <span class="wl-avatar" aria-hidden="true"></span>
              </div>
              <div class="wl-lines" aria-hidden="true"><span></span><span></span><span></span></div>
              <div class="wl-menu" data-placeholder="Chrome extensions menu">
                <div class="wl-menu-title" aria-hidden="true" data-i18n="ext.welcome.menu"></div>
                <div class="wl-menu-row">
                  <span class="wl-menu-icon" aria-hidden="true"><span data-mark-slot data-size="20"></span></span>
                  <span class="wl-menu-name" data-store-name></span>
                  <button class="wl-pin" type="button" aria-pressed="false" data-pin>
                    <svg data-icon="pin" width="20" height="20"></svg>
                    <span class="wl-mark" data-mark aria-hidden="true">2</span>
                  </button>
                </div>
                <div class="wl-menu-ghost" aria-hidden="true"><span></span><span></span></div>
                <div class="wl-menu-foot" aria-hidden="true" data-i18n="ext.welcome.manage"></div>
              </div>
              <svg class="wl-pointer" width="30" height="34" viewBox="0 0 30 34" aria-hidden="true" data-pointer><path d="M4 2l20 16-9 1.5 5.5 11-4 2-5.5-11L4 27z" fill="#FFFFFF" stroke="#0E1726" stroke-width="1.6" stroke-linejoin="round"></path></svg>
              <div class="wl-mock-foot">
                <p aria-live="polite" data-pin-caption></p>
                <button class="at-btn" type="button" data-pin-button></button>
              </div>
            </div>
          </figure>
        </section>

        <section class="wl-section" aria-labelledby="w-how">
          <div class="wl-how-head">
            <h2 id="w-how" data-i18n="ext.welcome.how.title"></h2>
            <p class="wl-muted" data-i18n="ext.welcome.how.sub"></p>
          </div>
          <div class="wl-how">
            <div class="wl-how-rule" aria-hidden="true"></div>
            <ol class="wl-how-list">
              <li>
                <span class="wl-num" aria-hidden="true">1</span>
                <div class="wl-art" aria-hidden="true">
                  <div class="at-seg at-seg-sunken at-seg-lamp wl-art-seg" style="--n: 4; --i: 2">
                    <span class="at-seg-ind"></span>
                    <span class="at-seg-item" data-i18n="tool.preset.p15"></span>
                    <span class="at-seg-item" data-i18n="tool.preset.p30"></span>
                    <span class="at-seg-item wl-art-on" data-i18n="tool.preset.p60"></span>
                    <span class="at-seg-item" data-i18n="tool.preset.pinf"></span>
                  </div>
                  <div class="wl-art-until" data-art-until></div>
                </div>
                <h3 data-i18n="ext.welcome.how1.title"></h3>
                <p data-art-how1></p>
              </li>
              <li>
                <span class="wl-num" aria-hidden="true">2</span>
                <div class="wl-art wl-art-row" aria-hidden="true">
                  <span class="wl-art-toolbar" data-placeholder="Chrome toolbar">
                    <span data-mark-slot data-size="34" data-glow="0"></span>
                    <span class="wl-art-badge" data-placeholder="Chrome badge">25m</span>
                  </span>
                  <span class="wl-art-state">
                    <span class="at-pill" data-lock="held"><span class="at-pill-dot"></span><span data-i18n="tool.pill.held"></span></span>
                    <span class="wl-muted-sm" data-i18n="ext.welcome.how2.art"></span>
                  </span>
                </div>
                <h3 data-i18n="ext.welcome.how2.title"></h3>
                <p data-i18n="ext.welcome.how2.body"></p>
              </li>
              <li>
                <span class="wl-num" aria-hidden="true">3</span>
                <div class="wl-art wl-art-row" aria-hidden="true">
                  <div class="wl-notif" data-placeholder="system notification">
                    <span class="wl-menu-icon wl-notif-icon"><span data-mark-slot data-size="16" data-state="ended"></span></span>
                    <span class="wl-notif-title" data-i18n="tool.kicker.timesup"></span>
                    <span class="wl-notif-body" data-notify-body></span>
                    <span class="wl-notif-actions"><span data-i18n="tool.extend.add15"></span><span data-i18n="tool.toast.dismiss"></span></span>
                  </div>
                </div>
                <h3 data-i18n="ext.welcome.how3.title"></h3>
                <p data-i18n="ext.welcome.how3.body"></p>
              </li>
            </ol>
          </div>
        </section>

        <section class="wl-section" aria-labelledby="w-level">
          <div class="wl-level-head">
            <h2 id="w-level" data-i18n="ext.welcome.level.title"></h2>
            <p class="wl-lead" data-i18n="ext.welcome.level.lead"></p>
          </div>
          <div class="wl-levels">
            <article class="wl-levelcard" aria-labelledby="lv-screen" data-level="display">
              <div class="wl-laptop" aria-hidden="true" data-placeholder="laptop illustration">
                <div class="wl-screen"><span data-mark-slot data-size="46"></span></div>
                <div class="wl-base"></div>
                <span class="wl-cpu"></span>
              </div>
              <div class="wl-levelcard-text">
                <div class="wl-levelcard-title"><h3 id="lv-screen" data-i18n="ext.level.display"></h3><span class="wl-badgetag wl-badgetag-screen">ON</span></div>
                <p class="wl-ink" data-i18n="ext.level.display.help"></p>
                <p class="wl-ink2" data-i18n="ext.welcome.level.screenGood"></p>
                <p class="wl-reads"><span data-i18n="ext.welcome.level.reads"></span> <span class="at-pill" data-lock="held"><span class="at-pill-dot" aria-hidden="true"></span><span data-i18n="tool.pill.held"></span></span></p>
              </div>
            </article>
            <article class="wl-levelcard" aria-labelledby="lv-system" data-level="system">
              <div class="wl-laptop" aria-hidden="true" data-placeholder="laptop illustration">
                <div class="wl-screen"><span data-mark-slot data-size="46"></span></div>
                <div class="wl-base"></div>
                <span class="wl-cpu"></span>
              </div>
              <div class="wl-levelcard-text">
                <div class="wl-levelcard-title"><h3 id="lv-system" data-i18n="ext.level.system"></h3><span class="wl-badgetag wl-badgetag-system">SYS</span></div>
                <p class="wl-ink" data-i18n="ext.level.system.help"></p>
                <p class="wl-ink2" data-i18n="ext.welcome.level.systemGood"></p>
                <p class="wl-reads"><span data-i18n="ext.welcome.level.reads"></span> <span class="at-pill" data-lock="held" data-level="system"><span class="at-pill-dot" aria-hidden="true"></span><span data-i18n="ext.pill.systemHeld"></span></span></p>
              </div>
            </article>
          </div>
        </section>

        <section class="wl-key" aria-labelledby="w-key">
          <div class="wl-keycaps" aria-hidden="true" data-keycaps></div>
          <div class="wl-key-text">
            <h2 id="w-key" data-key-title></h2>
            <p data-i18n="ext.welcome.key.body"></p>
          </div>
          <button class="at-btn" type="button" data-shortcut-change data-i18n="ext.options.shortcut.change"></button>
        </section>

        <section class="wl-section wl-two" data-i18n-aria="ext.welcome.limitsLabel">
          <div class="wl-col">
            <h2 data-i18n="ext.welcome.cant.title"></h2>
            <ul class="wl-list">
              <li><svg data-icon="laptop" width="20" height="20"></svg><span data-i18n="ext.welcome.cant.lid"></span></li>
              <li><svg data-icon="ban" width="20" height="20"></svg><span data-i18n="ext.welcome.cant.presence"></span></li>
              <li><svg data-icon="app-window" width="20" height="20"></svg><span data-i18n="ext.welcome.cant.closed"></span></li>
            </ul>
          </div>
          <div class="wl-col">
            <h2 data-i18n="ext.welcome.see.title"></h2>
            <ul class="wl-list wl-list-ok">
              <li><svg data-icon="circle-check" width="20" height="20" class="at-tone-good"></svg><span data-i18n="ext.welcome.see.account"></span></li>
              <li><svg data-icon="circle-check" width="20" height="20" class="at-tone-good"></svg><span data-i18n="ext.welcome.see.permissions"></span></li>
              <li><svg data-icon="circle-check" width="20" height="20" class="at-tone-good"></svg><span data-i18n="ext.welcome.see.data"></span></li>
            </ul>
            <a class="at-link at-link-underline" href="https://awaketab.com/privacy#extension" target="_blank" rel="noopener" data-i18n="ext.privacy.policy"></a>
          </div>
        </section>

        <section class="wl-next" aria-labelledby="w-next">
          <div class="wl-next-text">
            <h2 id="w-next" data-i18n="ext.welcome.next.title"></h2>
            <p data-i18n="ext.welcome.next.body"></p>
          </div>
          <div class="wl-next-actions">
            <a class="at-btn at-btn-primary" href="options.html" data-i18n="ext.welcome.openSettings"></a>
            <a class="at-btn at-btn-stop" href="https://awaketab.com/?source=ext" target="_blank" rel="noopener"><span data-i18n="ext.popup.open"></span><svg data-icon="external-link" width="16" height="16"></svg></a>
          </div>
        </section>
      </main>

      <footer class="at-foot">
        <p data-i18n="ext.footer.honest"></p>
        <nav data-i18n-aria="ext.footer.nav">
          <a href="https://awaketab.com/privacy" target="_blank" rel="noopener" data-i18n="footer.privacy"></a>
          <a href="https://awaketab.com/terms" target="_blank" rel="noopener" data-i18n="footer.terms"></a>
          <a href="https://awaketab.com/changelog" target="_blank" rel="noopener" data-i18n="footer.changelog"></a>
          <a href="https://awaketab.com/about" target="_blank" rel="noopener" data-i18n="ext.about.title"></a>
          <a href="https://buymeacoffee.com/awaketab" target="_blank" rel="noopener" data-i18n="footer.donate"></a>
        </nav>
      </footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
