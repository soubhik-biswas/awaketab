<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AwakeTab</title>
  </head>
  <body>
    <main class="pp" data-root data-mode="ready" hidden>
      <header class="pp-head">
        <span class="pp-logo" data-mark-slot data-size="26" data-small data-glow="0"></span>
        <h1 class="pp-word" data-i18n="app.name"></h1>
        <output class="at-pill pp-pill" data-pill data-lock="idle" aria-live="polite" aria-atomic="true">
          <span class="at-pill-dot" aria-hidden="true"></span>
          <svg data-icon="power" width="14" height="14" class="at-pill-icon" data-pill-icon="idle"></svg>
          <svg data-icon="pause" width="14" height="14" class="at-pill-icon" data-pill-icon="lost"></svg>
          <svg data-icon="triangle-alert" width="14" height="14" class="at-pill-icon" data-pill-icon="blocked"></svg>
          <span data-pill-text></span>
        </output>
      </header>

      <div class="pp-body">
        <section class="pp-state" data-i18n-aria="ext.popup.status">
          <p class="pp-line at-in" data-pill-extra hidden>
            <svg data-icon="moon" width="16" height="16" class="at-tone-state"></svg>
            <span data-i18n="ext.pill.system"></span>
          </p>
          <p class="pp-line at-in" data-origin hidden>
            <svg data-icon="calendar-days" width="16" height="16" class="at-tone-state" data-origin-icon="schedule"></svg><svg data-icon="power" width="16" height="16" class="at-tone-state" data-origin-icon="startup" hidden></svg><svg data-icon="globe" width="16" height="16" class="at-tone-state" data-origin-icon="autostart" hidden></svg>
            <span data-origin-text></span>
          </p>
          <p class="pp-meta" data-meta></p>
          <p class="pp-meta2" data-meta2 hidden></p>
          <p class="pp-fail at-in" role="alert" data-fail hidden>
            <svg data-icon="info" width="16" height="16"></svg>
            <span data-i18n="ext.popup.noAnswer"></span>
          </p>
        </section>

        <section class="pp-card pp-card-info pp-private at-rise" aria-labelledby="pv-h" data-private hidden>
          <svg data-icon="venetian-mask" width="18" height="18" class="pp-card-icon"></svg>
          <div class="pp-card-body">
            <h2 id="pv-h" data-i18n="ext.private.title"></h2>
            <p data-i18n="ext.private.body"></p>
          </div>
        </section>

        <div class="pp-ring" data-ring>
          <svg class="pp-ring-svg" width="72" height="72" viewBox="0 0 72 72" aria-hidden="true" focusable="false">
            <circle class="pp-track" cx="36" cy="36" r="30"></circle>
            <circle class="pp-arc" data-arc cx="36" cy="36" r="30" transform="rotate(-90 36 36)"></circle>
          </svg>
          <div class="pp-center" data-center>
            <span class="pp-kicker" data-kicker hidden></span>
            <span class="pp-timer at-num" role="timer" data-timer-box>
              <span class="pp-days" data-days hidden></span>
              <span class="pp-digits" data-timer><span data-timer-main></span><span class="pp-sec" data-timer-sec></span></span>
            </span>
            <span class="pp-caption" data-caption></span>
          </div>
        </div>

        <section class="pp-card pp-card-bad pp-error at-rise" aria-labelledby="er-h" data-error hidden>
          <svg data-icon="triangle-alert" width="18" height="18" class="pp-card-icon"></svg>
          <div class="pp-card-body">
            <h2 id="er-h" data-error-title></h2>
            <p data-error-body></p>
          </div>
        </section>

        <section class="pp-card pp-card-ended pp-extend at-rise" aria-labelledby="ex-h" data-extend hidden>
          <h2 id="ex-h" class="at-sr" data-i18n="tool.extend.title"></h2>
          <div class="pp-extend-row" role="group" aria-labelledby="ex-h">
            <button class="at-btn at-btn-primary at-btn-sm" type="button" data-extend-ms="900000" data-i18n="tool.extend.add15" data-i18n-aria="ext.extend.aria15"></button>
            <button class="at-btn at-btn-sec at-btn-sm" type="button" data-extend-ms="1800000" data-i18n="tool.extend.add30" data-i18n-aria="ext.extend.aria30"></button>
            <button class="at-btn at-btn-sec at-btn-sm" type="button" data-extend-ms="3600000" data-i18n="tool.extend.add60" data-i18n-aria="ext.extend.aria60"></button>
          </div>
          <button class="at-btn at-btn-stop at-btn-sm" type="button" data-dismiss data-i18n="tool.extend.stop"></button>
          <p class="pp-extend-note" data-extend-note></p>
        </section>

        <div class="pp-levels" role="radiogroup" data-levels data-i18n-aria="ext.level.label">
          <div class="at-seg pp-seg">
            <label class="at-seg-item"><input class="at-sr" type="radio" name="level" value="display" /><svg data-icon="monitor" width="16" height="16"></svg><span data-i18n="ext.level.display"></span></label>
            <label class="at-seg-item"><input class="at-sr" type="radio" name="level" value="system" /><svg data-icon="cpu" width="16" height="16"></svg><span data-i18n="ext.level.system"></span></label>
          </div>
          <p class="pp-help" aria-live="polite" data-level-help></p>
        </div>

        <div class="pp-chips" role="group" data-chips data-i18n-aria="ext.popup.lengths">
          <button class="pp-chip" type="button" data-preset="p15" data-i18n="tool.preset.p15"></button>
          <button class="pp-chip" type="button" data-preset="p30" data-i18n="tool.preset.p30"></button>
          <button class="pp-chip" type="button" data-preset="p45" data-i18n="tool.preset.p45"></button>
          <button class="pp-chip" type="button" data-preset="p60" data-i18n="tool.preset.p60"></button>
          <button class="pp-chip" type="button" data-preset="p120" data-i18n="tool.preset.p120"></button>
          <button class="pp-chip" type="button" data-preset="p240" data-i18n="tool.preset.p240"></button>
          <button class="pp-chip" type="button" data-preset="pinf" data-i18n="tool.preset.pinf" data-i18n-aria="tool.preset.pinf.sr"></button>
          <button class="pp-chip pp-chip-add" type="button" data-until-open></button>
        </div>

        <form class="pp-until at-in" data-until hidden>
          <div class="pp-until-row">
            <button class="pp-step" type="button" data-until-less data-i18n-aria="ext.until.earlier"><svg data-icon="minus" width="20" height="20"></svg></button>
            <div class="pp-until-mid">
              <span class="at-kick" data-i18n="tool.until.title"></span>
              <output class="pp-until-time at-num" data-until-time></output>
            </div>
            <button class="pp-step" type="button" data-until-more data-i18n-aria="ext.until.later"><svg data-icon="plus" width="20" height="20"></svg></button>
          </div>
          <p class="pp-help pp-center-text" aria-live="polite" data-until-summary></p>
          <div class="pp-until-actions">
            <button class="at-btn at-btn-stop" type="button" data-until-cancel data-i18n="tool.until.cancel"></button>
            <button class="at-btn at-btn-primary" type="submit" data-i18n="tool.until.start"></button>
          </div>
        </form>

        <div class="pp-primary" data-primary>
          <button class="at-btn pp-main" type="button" data-toggle>
            <span data-toggle-label></span>
          </button>
          <div class="pp-retry" data-retry-row hidden>
            <button class="at-btn at-btn-primary" type="button" data-retry></button>
            <a class="at-btn at-btn-sec" href="https://awaketab.com/?source=ext" target="_blank" rel="noopener"><span data-i18n="ext.popup.open"></span><svg data-icon="external-link" width="16" height="16"></svg></a>
          </div>
          <a class="at-btn at-btn-primary at-btn-full" href="https://awaketab.com/?source=ext" target="_blank" rel="noopener" data-open-tab hidden><span data-i18n="ext.popup.openTab"></span><svg data-icon="external-link" width="16" height="16"></svg></a>
          <div class="pp-note" aria-live="polite" data-note hidden>
            <p data-note-text></p>
            <button class="pp-note-link" type="button" data-note-link hidden data-i18n="ext.autostart.change"></button>
          </div>
        </div>

        <div class="pp-add at-rise" role="group" data-add hidden>
          <button class="at-btn at-btn-sec" type="button" data-add-ms="900000" data-i18n="tool.extend.add15" data-i18n-aria="ext.extend.aria15"></button>
          <button class="at-btn at-btn-sec" type="button" data-add-ms="1800000" data-i18n="tool.extend.add30" data-i18n-aria="ext.extend.aria30"></button>
          <button class="at-btn at-btn-sec" type="button" data-add-ms="3600000" data-i18n="tool.extend.add60" data-i18n-aria="ext.extend.aria60"></button>
        </div>

        <section class="pp-card pp-sched at-rise" aria-labelledby="sc-h" data-sched hidden>
          <svg data-icon="calendar-days" width="18" height="18" class="pp-card-icon at-tone-good"></svg>
          <div class="pp-card-body">
            <h2 id="sc-h" data-sched-days></h2>
            <span class="pp-sched-range" data-sched-range></span>
          </div>
          <button class="pp-card-action" type="button" data-sched-edit data-i18n="ext.schedule.edit" data-i18n-aria="ext.schedule.editAria"></button>
        </section>

        <button class="pp-prorow" type="button" aria-expanded="false" aria-controls="pp-pro" data-pro-row hidden>
          <svg data-icon="calendar-days" width="18" height="18"></svg>
          <span class="pp-prorow-text" data-i18n="ext.pro.row"></span>
          <span class="at-tag" data-i18n="pro.badge"></span>
        </button>

        <section class="pp-card pp-pro at-rise" id="pp-pro" aria-labelledby="pro-h" data-pro hidden>
          <div class="pp-pro-head">
            <h2 id="pro-h" data-i18n="ext.pro.locked"></h2>
            <button class="pp-icon pp-close" type="button" data-pro-close data-i18n-aria="ext.close">
              <svg data-icon="x" width="18" height="18"></svg>
            </button>
          </div>
          <p><span data-i18n="ext.pro.body"></span><span class="pp-pro-price" data-pro-price></span></p>
          <div class="pp-pro-actions">
            <a class="at-btn at-btn-primary at-btn-sm" href="https://awaketab.com/pro?source=ext" target="_blank" rel="noopener"><span data-i18n="ext.pro.plans"></span><svg data-icon="external-link" width="16" height="16"></svg></a>
            <button class="at-btn at-btn-quiet at-btn-sm pp-key" type="button" data-pro-key data-i18n="ext.pro.haveKey"></button>
          </div>
        </section>

        <section class="pp-card pp-tips at-rise" aria-labelledby="tips-h" data-tips hidden>
          <div class="pp-tips-head">
            <h2 id="tips-h" class="at-kick" data-i18n="ext.tips.title"></h2>
            <button class="at-btn at-btn-sec at-btn-sm pp-tips-ok" type="button" data-tips-ok data-i18n="ext.tips.ok"></button>
          </div>
          <ul class="pp-tips-list">
            <li>
              <span class="at-kbds" aria-hidden="true" data-tips-keys></span>
              <span><span class="at-sr" data-tips-shortcut></span><span data-i18n="ext.tips.shortcut"></span></span>
            </li>
            <li>
              <span class="pp-tips-icon" aria-hidden="true" data-placeholder="toolbar icon">
                <span data-mark-slot data-size="20" data-state="awake"></span>
                <span class="pp-tips-badge">25m</span>
              </span>
              <span data-i18n="ext.tips.pin"></span>
            </li>
          </ul>
        </section>
      </div>

      <footer class="pp-foot" data-foot>
        <a class="pp-foot-btn" href="https://awaketab.com/?source=ext" target="_blank" rel="noopener" data-i18n="ext.popup.fullTimer"></a>
        <a class="pp-new at-in" href="https://awaketab.com/changelog?source=ext" target="_blank" rel="noopener" data-new hidden>
          <span class="pp-new-dot" aria-hidden="true"></span>
          <span data-new-label></span>
        </a>
        <button class="pp-foot-btn" type="button" data-options data-i18n="settings.title"></button>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
