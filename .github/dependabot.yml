version: 2
updates:
  # One manifest at the root covers the whole pnpm workspace.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    versioning-strategy: increase
    # pnpm refuses releases younger than its minimum release age, so wait before proposing them.
    cooldown:
      default-days: 14
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']
