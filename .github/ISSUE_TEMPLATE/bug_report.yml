name: Bug report
description: Help reproduce and fix a problem in AwakeTab.
title: '[Bug]: '
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. Please search existing issues first, and remove passwords,
        licence keys, tokens and personal data. Questions are best asked in
        [Discussions](https://github.com/soubhik-biswas/awaketab/discussions/categories/q-a), and security problems
        must be [reported privately](https://github.com/soubhik-biswas/awaketab/security/advisories/new). Only the
        repository owner can approve work.
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options:
        - Website (awaketab.com)
        - Chrome or Edge extension
        - Website widget (embed)
        - npm library (@awaketab/wake or @awaketab/core)
        - Not sure
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page, version or component
      description: The URL, the extension version, or the library version and function.
      placeholder: https://awaketab.com/30m
    validations:
      required: false
  - type: dropdown
    id: pill
    attributes:
      label: What did the status pill show?
      description: The exact text helps most. Pick the closest one, or "Other or none" and write it below.
      options:
        - Ready
        - Starting…
        - Screen awake
        - Paused — tab hidden
        - Blocked — here's the fix
        - Tap to use the fallback
        - Awake via video fallback
        - System awake (extension)
        - Other or none
        - Not applicable (library)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps from opening the page or extension, with a minimal example if you can.
      placeholder: |
        1. Open https://awaketab.com/30m
        2. Switch to another tab for a minute
        3. Come back
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include any other text on screen, and whether the screen actually dimmed or locked.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: Find it in the browser's About page.
      placeholder: Chrome 131.0.6778.86
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: Windows 11 24H2, macOS 15.1, iOS 18.1, Android 15
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: The model, and whether it was on battery, plugged in or in a power-saving mode.
      placeholder: iPad Air (5th generation), on battery, Low Power Mode on
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocks a core task
        - Affects some users or a workaround exists
        - Visual or minor issue
        - Not sure
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, redacted console logs or a short recording.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and removed sensitive information.
          required: true
        - label: I checked the [browser support matrix](https://awaketab.com/learn/browser-support-matrix) and
            [honest limits](https://awaketab.com/learn/honest-limits).
          required: false
