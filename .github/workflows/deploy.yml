name: Deploy

# Ships the Next site (apps/site) to Cloudflare Workers once CI is green:
#   main → Worker awaketab-site (production)
#   play → Worker awaketab-site-preview (the dev site, wrangler env "preview")
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Cloudflare → My Profile → API Tokens → "Edit Cloudflare
# Workers" template, plus D1 Edit) and CLOUDFLARE_ACCOUNT_ID. Without the token the job skips with a notice.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, play]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    env:
      BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip without a Cloudflare token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice title=Deploy skipped::Add the CLOUDFLARE_API_TOKEN secret to deploy automatically."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm install --frozen-lockfile
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm -F @awaketab/wake -F @awaketab/core build
      - name: Apply sign-in database migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/site
        run: |
          if [ "$BRANCH" = "main" ]; then
            pnpm exec wrangler d1 migrations apply awaketab-auth --remote
          else
            pnpm exec wrangler d1 migrations apply awaketab-auth-preview --remote --env preview
          fi
      - name: Build and deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/site
        run: |
          if [ "$BRANCH" = "main" ]; then
            pnpm run deploy
          else
            pnpm exec opennextjs-cloudflare build && pnpm exec opennextjs-cloudflare deploy --env preview
          fi
