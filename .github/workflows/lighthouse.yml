name: Lighthouse

# Audits the site with lighthouserc.cjs. A pull request builds it here and audits localhost:4173;
# a manual run with a base URL (e.g. https://play.awaketab.com) audits that origin and builds nothing.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Origin to audit, e.g. https://play.awaketab.com (empty = build and audit locally)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LHCI_BASE_URL: ${{ inputs.base_url || '' }}
      LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.17.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (local mode only)
        if: env.LHCI_BASE_URL == ''
        run: pnpm build
      - name: Lighthouse CI
        run: pnpm lighthouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
          # The folder name starts with a dot, so without this nothing is uploaded.
          include-hidden-files: true
