name: Lighthouse

# One config (lighthouserc.cjs) for both modes:
# - a manual run with a base URL (e.g. https://play.awaketab.com) audits that origin and builds nothing;
# - a pull request builds the site here and LHCI starts the Next server on localhost:4173.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Origin to audit, e.g. https://play.awaketab.com (empty = build and audit locally)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LHCI_BASE_URL: ${{ inputs.base_url || '' }}
      LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (local mode only)
        if: env.LHCI_BASE_URL == ''
        run: pnpm build
      - name: Lighthouse CI
        run: pnpm lighthouse
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
          # The folder name starts with a dot, so without this nothing is uploaded.
          include-hidden-files: true
