name: Release

# Versions and publishes @awaketab/wake to npm, and runs the launch guard for the site and the extension.
# Publishing stays off until the repository variable NPM_PUBLISH_ENABLED is 'true' (docs/14-devops.md §2).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fails while a production licence key or checkout link is still a placeholder; publish-wake does not wait for it.
  launch-guard:
    if: vars.LAUNCH_READY == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.17.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production licence keys and checkout links
        run: pnpm keys:check
        env:
          PUBLIC_POLAR_SERVER: production

  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.17.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm changeset version
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-wake:
    needs: version
    if: needs.version.outputs.hasChangesets == 'false' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.17.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted publishing (OIDC, no long-lived token) needs npm ≥ 11.5.1; Node 22 bundles npm 10.
      - run: npm install -g npm@11.6.2
      - run: pnpm install --frozen-lockfile
      - name: Test the library
        run: pnpm vitest run --config vitest.config.ts packages/wake
      - name: Build and size-check the library
        run: pnpm -F @awaketab/wake build && pnpm -F @awaketab/wake size
      - name: Check whether this version is already on npm
        id: check
        run: |
          VERSION=$(node -p "require('./packages/wake/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@awaketab/wake@$VERSION" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@awaketab/wake@$VERSION is already on npm; nothing to publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Pack (dry run) — the exact file list that will be published
        if: steps.check.outputs.published == 'false'
        working-directory: packages/wake
        run: npm pack --dry-run
      - name: Publish with provenance
        if: steps.check.outputs.published == 'false'
        working-directory: packages/wake
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Tag the release
        if: steps.check.outputs.published == 'false'
        run: |
          TAG="@awaketab/wake@${{ steps.check.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"
