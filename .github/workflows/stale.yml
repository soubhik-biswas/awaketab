name: Close unanswered questions

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    if: github.repository_owner == 'soubhik-biswas'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
      # Lets the action clear its own saved state between runs.
      actions: write
    steps:
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          only-issue-labels: needs-information
          exempt-issue-labels: security,pinned
          days-before-issue-stale: 14
          days-before-issue-close: 7
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          remove-issue-stale-when-updated: true
          close-issue-reason: not_planned
          stale-issue-message: >
            Thanks for opening this. We asked for a little more information two weeks ago and have not heard back
            yet, so we cannot move this forward. If you can add the details, please reply here and it will stay open.
            Otherwise it will close in 7 days.
          close-issue-message: >
            Closing this because the information we needed did not arrive. No problem at all: if you can reproduce it
            again or have the details, reply here or open a new issue and link this one, and we will pick it up.
