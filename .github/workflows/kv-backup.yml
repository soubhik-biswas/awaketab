# Weekly encrypted export of the Workers KV namespaces.
# The secrets it needs and how to restore a backup are in docs/14-devops.md §7.
name: KV backup

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kv-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KV_LICENSES_ID: ${{ secrets.KV_LICENSES_ID }}
      KV_LICENSES_PREVIEW_ID: ${{ secrets.KV_LICENSES_PREVIEW_ID }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - name: Check configuration
        id: config
        shell: bash
        run: |
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID KV_LICENSES_ID BACKUP_ENCRYPTION_KEY)
          missing=()
          for name in "${required[@]}"; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -eq "${#required[@]}" ]; then
            echo "::notice title=KV backup skipped::No backup secrets are configured in this repository, so nothing was exported. Add ${required[*]} (docs/14-devops.md §7)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=KV backup misconfigured::Missing repository secrets: ${missing[*]} (docs/14-devops.md §7)."
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.config.outputs.enabled == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.17.0
      - if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - if: steps.config.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      # Each file is checked to decrypt back to the same records before it is written; any API error fails the run.
      - if: steps.config.outputs.enabled == 'true'
        run: pnpm kv:backup --out kv-backups

      - if: steps.config.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kv-backup-${{ github.run_id }}
          path: kv-backups/*.jsonl.enc
          if-no-files-found: error
          retention-days: 84 # 12 weeks
          compression-level: 0 # ciphertext does not compress
